name: Ratbot
on:
  pull_request

permissions: {}

jobs:
  comment:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust and Cargo
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env

      - name: Install Tokei
        run: cargo install tokei

      - name: Run Tokei and get the lines of code
        run: tokei crates/ratchet-core > tokei_output.txt

      - name: Comment or Update PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const tokeiOutput = fs.readFileSync('tokei_output.txt', 'utf8');
            const uniqueIdentifier = 'Code Metrics Report'; 
            const codeReport = `
              <details>
              <summary>${uniqueIdentifier}</summary>
              <pre>
              ${tokeiOutput}
              </pre>
              </details>
            `;

            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;

            const comments = await github.rest.issues.listComments({
              issue_number,
              owner,
              repo
            });

            const existingComment = comments.data.find(comment => comment.body.includes(uniqueIdentifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: codeReport
              });
            } else {
              await github.rest.issues.createComment({
                issue_number,
                owner,
                repo,
                body: codeReport
              });
            }

